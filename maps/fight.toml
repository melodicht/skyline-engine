# Two-player fight demo. P1 (left): A/D move left/right, W attack, S dash.
# P2 (right): J/L move left/right, I attack, K dash.
# Attack the bouncing ball to launch it;
# attack an incoming ball to pop it upward. Body contact while attacking
# or a launched-ball hit removes the loser.
# Speeds are units/second.
