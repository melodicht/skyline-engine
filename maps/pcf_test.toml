outerCone = 22.0
range = 9.0

[spotOccB.Transform3D]
position = [-3.0, 0.0, 0.0]
scale = [0.4, 0.4, 0.4]
[spotOccB.MeshComponent]
mesh = "cube"
color = [0.9, 0.3, 0.2]

[spotC.Transform3D]
position = [-12.0, 9.0, 0.0]
[spotC.SpotLight]
diffuse = [2.0, 2.0, 2.0]
specular = [0.0, 0.0, 0.0]
